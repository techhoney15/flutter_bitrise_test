format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - FLUTTER_VERSION: "3.19.0"
    - PROJECT_LOCATION: "."

workflows:

  build_only:
    steps:
      - activate-ssh-key@4: {}

      - git-clone@8: {}

      - flutter-installer@0:
          inputs:
            - version: $FLUTTER_VERSION
            - is_update: "false"

      - cache-pull@2: {}

      - flutter-test@1:
          inputs:
            - project_location: $PROJECT_LOCATION

      - flutter-build@0:
          inputs:
            - project_location: $PROJECT_LOCATION
            - platform: both        # builds both Android APK + iOS
            - android_output_type: apk
            - ios_output_type: archive

      - cache-push@2: {}

      - deploy-to-bitrise-io@2: {}  # stores the APK/IPA as downloadable artifacts

trigger_map:
  - push_branch: prod_release
    workflow: build_only