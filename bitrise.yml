format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - PROJECT_LOCATION: "."

workflows:
  build_only:
    steps:
      - activate-ssh-key@4: {}

      - git-clone@8: {}

      - flutter-installer@0:
          inputs:
            - version: "latest"
            - is_update: "false"

      - cache-pull@2: {}

      - flutter-build@0:
          inputs:
            - project_location: $PROJECT_LOCATION
            - platform: android           # android ONLY, simpler
            - android_output_type: apk

      - cache-push@2:
          is_always_run: true

      - deploy-to-bitrise-io@2:
          is_always_run: true             # ← THIS is critical, runs even if prev step fails
          inputs:
            - deploy_path: $BITRISE_APK_PATH   # explicit path
            - notify_user_groups: none