---
format_version: '23'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: elite
app:
  envs:
  - BITRISE_FLUTTER_PROJECT_LOCATION: "."
    opts:
      is_expand: false
  - FIREBASE_APP_ID: 1:689342923546:android:87b562d000793fcfd662a3
    opts:
      is_expand: false
  - FIREBASE_IOS_APP_ID: 1:689342923546:ios:2b911f54f31a4c93d662a3
    opts:
      is_expand: false
  - FIREBASE_TESTER_GROUPS: all-testers
    opts:
      is_expand: false
triggers:
  push:
  - branch: prod_release
    workflow: Firebase-deploy
  pull_request:
  - source_branch: "*"
    workflow: primary
workflows:
  primary:
    description: Runs tests and builds APK on every pull request.
    steps:
    - git-clone@8: {}
    - flutter-installer@1:
        inputs:
        - version: 3.24.5
    - restore-dart-cache@2: {}
    - flutter-test@1:
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
    - flutter-build@0:
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
        - platform: android
        - android_output_type: apk
    - save-dart-cache@1: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true
  deploy:
    description: Analyzes, tests, builds and deploys Android APK to Bitrise Artifacts.
    steps:
    - git-clone@8: {}
    - flutter-installer@1:
        inputs:
        - version: 3.24.5
    - flutter-analyze@0:
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
    - flutter-test@1:
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
    - flutter-build@0:
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
        - platform: android
        - android_output_type: apk
    - deploy-to-bitrise-io@2:
        is_always_run: true
  Firebase-deploy:
    description: Builds Android APK and iOS IPA, then distributes both to testers
      via Firebase App Distribution.
    meta:
      bitrise.io:
        stack: osx-xcode-16.2.x
        machine_type_id: g2.mac.large
    steps:
    - git-clone@8: {}
    - flutter-installer@1:
        inputs:
        - version: 3.24.5
    - restore-dart-cache@2: {}
    - certificate-and-profile-installer@1: {}
    - flutter-build@0:
        title: Build Android APK
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
        - platform: android
        - android_output_type: apk
    - script@1:
        title: Save Firebase Service Account JSON
        inputs:
        - content: |
            #!/bin/bash
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > $BITRISE_SOURCE_DIR/firebase-service-account.json
    - firebase-app-distribution@0:
        title: Distribute Android APK to Firebase
        inputs:
        - app: "$FIREBASE_APP_ID"
        - service_credentials_file: "$BITRISE_SOURCE_DIR/firebase-service-account.json"
        - app_path: "$BITRISE_APK_PATH"
        - release_notes: 'Branch: $BITRISE_GIT_BRANCH | $GIT_CLONE_COMMIT_MESSAGE_SUBJECT'
        - groups: "$FIREBASE_TESTER_GROUPS"
    - flutter-build@0:
        title: Build iOS Archive
        inputs:
        - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
        - platform: ios
        - ios_output_type: archive
        - ios_additional_params: "--release --no-codesign"
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_FLUTTER_PROJECT_LOCATION/ios/Runner.xcworkspace"
        - scheme: Runner
        - distribution_method: ad-hoc
        - automatic_code_signing: 'off'
        - export_development_team: CLX8X3P664
    - firebase-app-distribution@0:
        title: Distribute iOS IPA to Firebase
        inputs:
        - app: "$FIREBASE_IOS_APP_ID"
        - service_credentials_file: "$BITRISE_SOURCE_DIR/firebase-service-account.json"
        - app_path: "$BITRISE_IPA_PATH"
        - release_notes: 'Branch: $BITRISE_GIT_BRANCH | $GIT_CLONE_COMMIT_MESSAGE_SUBJECT'
        - groups: "$FIREBASE_TESTER_GROUPS"
    - save-dart-cache@1: {}
    - deploy-to-bitrise-io@2:
        is_always_run: true
    triggers:
      push:
      - branch: prod_release
