allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { sub ->
    if (sub.name != 'app') {
        sub.afterEvaluate {
            if (sub.hasProperty('android') && sub.android.namespace == null) {
                def manifest = file("${sub.projectDir}/src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def xml = new XmlSlurper().parse(manifest)
                    def packageName = xml.@package.toString()
                    if (packageName) {
                        sub.android.namespace = packageName
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
